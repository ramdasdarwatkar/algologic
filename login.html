<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Algologic Institutional Terminal</title>
  <meta name="description" content="Sign in to Algologic - Quantitative Market Research & Systematic Trade Signals Platform.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .bg-dot-pattern {
      background-image: radial-gradient(rgba(148, 163, 184, 0.22) 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-900 font-sans h-screen max-h-screen overflow-hidden">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState } = React;

    const IconEye = () => (
      <svg className="w-3.5 h-3.5 text-slate-400 hover:text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    );

    const IconEyeOff = () => (
      <svg className="w-3.5 h-3.5 text-slate-400 hover:text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
        <line x1="2" y1="2" x2="22" y2="22"/>
      </svg>
    );

    const IconArrowLeft = () => (
      <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
    );

    const IconCheck = () => (
      <svg className="w-3.5 h-3.5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    );

    const IconBolt = () => (
      <svg className="w-3.5 h-3.5 text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
    );

    function LoginPage() {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [showPassword, setShowPassword] = useState(false);
      const [rememberMe, setRememberMe] = useState(true);
      const [isLoading, setIsLoading] = useState(false);
      const [loginSuccess, setLoginSuccess] = useState(false);
      const [forgotModal, setForgotModal] = useState(false);
      const [forgotEmail, setForgotEmail] = useState("");
      const [forgotSent, setForgotSent] = useState(false);

      const handleDemoLogin = () => {
        setEmail("trader@algologic.com");
        setPassword("algoLogic#2026");
        setIsLoading(true);
        setTimeout(() => {
          setIsLoading(false);
          setLoginSuccess(true);
        }, 1000);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!email || !password) return;
        setIsLoading(true);
        setTimeout(() => {
          setIsLoading(false);
          setLoginSuccess(true);
        }, 1100);
      };

      const handleForgotSubmit = (e) => {
        e.preventDefault();
        if (forgotEmail) {
          setForgotSent(true);
          setTimeout(() => {
            setForgotModal(false);
            setForgotSent(false);
            setForgotEmail("");
          }, 2000);
        }
      };

      return (
        <div className="h-screen max-h-screen overflow-hidden flex flex-col justify-between bg-[#F8FAFC] bg-dot-pattern">
          
          {/* Top Compact Header */}
          <header className="w-full bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-4 sm:px-6 h-12 flex items-center justify-between shrink-0">
            <a href="index.html" className="flex items-center gap-2">
              <div className="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-2xs font-bold text-xs">
                AL
              </div>
              <span className="text-base font-black tracking-tight text-slate-900">
                algo<span className="text-indigo-600">logic</span>
              </span>
            </a>

            <a
              href="index.html"
              className="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 px-2.5 py-1 rounded-lg hover:bg-slate-100 transition-colors"
            >
              <IconArrowLeft />
              <span>Back to Homepage</span>
            </a>
          </header>

          {/* Main Auth Container - Strictly Fixed Height, No Scroll */}
          <main className="flex-1 flex items-center justify-center p-3 sm:p-4 overflow-hidden">
            <div className="w-full max-w-4xl bg-white rounded-2xl border border-slate-200/90 shadow-2xl shadow-slate-200/60 overflow-hidden grid grid-cols-1 lg:grid-cols-12 max-h-[calc(100vh-4.5rem)]">
              
              {/* LEFT COLUMN: CLEAN, SOPHISTICATED & UNCLUTTERED (NO NOISE) */}
              <div className="lg:col-span-6 bg-slate-900 p-6 sm:p-8 text-white flex flex-col justify-between overflow-hidden">
                
                <div>
                  <div className="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-slate-800 text-[10px] font-mono text-indigo-300 border border-slate-700 mb-3">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>INSTITUTIONAL QUANT DESK</span>
                  </div>

                  <h2 className="text-2xl font-black tracking-tight text-white leading-tight">
                    Systematic Edge. <br />
                    <span className="bg-gradient-to-r from-indigo-400 via-sky-300 to-emerald-400 bg-clip-text text-transparent">
                      Disciplined Execution.
                    </span>
                  </h2>

                  <p className="mt-2 text-xs text-slate-400 leading-relaxed font-normal">
                    Algologic analyzes 2,400+ NSE equities in real time, detecting institutional order book imbalances and generating high-probability breakout signals.
                  </p>

                  {/* Clean 3-Pillar Value List (No messy diagrams or candle doodles) */}
                  <div className="my-5 space-y-3 font-mono text-xs">
                    <div className="p-3 rounded-xl bg-slate-800/80 border border-slate-700/80 flex items-start gap-3">
                      <div className="w-5 h-5 rounded-md bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold text-[10px] shrink-0 mt-0.5">
                        01
                      </div>
                      <div>
                        <span className="font-bold text-slate-200 block text-xs">Pre-Market IEP Discovery</span>
                        <span className="text-[11px] text-slate-400 font-sans">Indicative equilibrium price gap analysis ready at 09:08 AM.</span>
                      </div>
                    </div>

                    <div className="p-3 rounded-xl bg-slate-800/80 border border-slate-700/80 flex items-start gap-3">
                      <div className="w-5 h-5 rounded-md bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-[10px] shrink-0 mt-0.5">
                        02
                      </div>
                      <div>
                        <span className="font-bold text-slate-200 block text-xs">5-Minute Volume Breakouts</span>
                        <span className="text-[11px] text-slate-400 font-sans">Open=Low confirmation with 5x relative volume expansion.</span>
                      </div>
                    </div>

                    <div className="p-3 rounded-xl bg-slate-800/80 border border-slate-700/80 flex items-start gap-3">
                      <div className="w-5 h-5 rounded-md bg-cyan-500/20 text-cyan-400 flex items-center justify-center font-bold text-[10px] shrink-0 mt-0.5">
                        03
                      </div>
                      <div>
                        <span className="font-bold text-slate-200 block text-xs">Mathematical Risk Asymmetry</span>
                        <span className="text-[11px] text-slate-400 font-sans">Strict 1:2.4 risk-to-reward ratio with zero-repaint execution.</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="text-[11px] font-mono text-slate-400 pt-2 border-t border-slate-800 flex items-center justify-between">
                  <span>Mumbai AP-SOUTH-1 Co-Location</span>
                  <span className="text-emerald-400 font-semibold">Latency &lt;1.2ms</span>
                </div>

              </div>

              {/* RIGHT COLUMN: ULTRA-CLEAN SIGN-IN (FIXED HEIGHT, NO SCROLL) */}
              <div className="lg:col-span-6 p-6 sm:p-8 flex flex-col justify-between overflow-hidden">
                
                <div>
                  
                  {/* Header */}
                  <div className="mb-4">
                    <h3 className="text-xl font-black text-slate-900 tracking-tight">
                      Terminal Sign In
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Enter credentials to access Algologic signals & research.
                    </p>
                  </div>

                  {/* 1-Click Demo Shortcut */}
                  <div className="mb-4">
                    <button
                      type="button"
                      onClick={handleDemoLogin}
                      className="w-full py-2 px-3 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-800 text-xs font-semibold flex items-center justify-between transition-colors shadow-2xs font-mono"
                    >
                      <div className="flex items-center gap-1.5">
                        <IconBolt />
                        <span>Demo Quant Account</span>
                      </div>
                      <span className="text-[11px] text-indigo-600 font-bold">
                        1-Click Fill & Sign In →
                      </span>
                    </button>
                  </div>

                  {/* Credentials Form */}
                  <form onSubmit={handleSubmit} className="space-y-3">
                    
                    {/* Work Email */}
                    <div>
                      <label className="block text-[11px] font-mono font-bold text-slate-700 mb-1 uppercase">
                        Work Email
                      </label>
                      <input
                        type="email"
                        required
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        placeholder="trader@algologic.com"
                        className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 font-mono transition-all"
                      />
                    </div>

                    {/* Password */}
                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="block text-[11px] font-mono font-bold text-slate-700 uppercase">
                          Password
                        </label>
                        <button
                          type="button"
                          onClick={() => setForgotModal(true)}
                          className="text-[11px] text-slate-500 hover:text-slate-900 font-medium"
                        >
                          Forgot Password?
                        </button>
                      </div>
                      <div className="relative">
                        <input
                          type={showPassword ? "text" : "password"}
                          required
                          value={password}
                          onChange={(e) => setPassword(e.target.value)}
                          placeholder="••••••••••••"
                          className="w-full px-3 pr-9 py-2 rounded-xl border border-slate-200 text-xs placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 font-mono transition-all"
                        />
                        <button
                          type="button"
                          onClick={() => setShowPassword(!showPassword)}
                          className="absolute inset-y-0 right-0 pr-2.5 flex items-center"
                        >
                          {showPassword ? <IconEyeOff /> : <IconEye />}
                        </button>
                      </div>
                    </div>

                    {/* Remember me */}
                    <div className="flex items-center justify-between text-xs pt-0.5">
                      <label className="flex items-center gap-1.5 text-slate-600 cursor-pointer text-[11px]">
                        <input
                          type="checkbox"
                          checked={rememberMe}
                          onChange={(e) => setRememberMe(e.target.checked)}
                          className="rounded border-slate-300 text-slate-900 focus:ring-slate-900 cursor-pointer"
                        />
                        <span>Remember session (30 days)</span>
                      </label>
                    </div>

                    {/* Submit Button */}
                    <button
                      type="submit"
                      disabled={isLoading}
                      className="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs uppercase tracking-wider transition-all flex items-center justify-center gap-2 shadow-sm font-mono mt-1 disabled:opacity-70"
                    >
                      {isLoading ? (
                        <span>Authenticating Session...</span>
                      ) : (
                        <span>Sign In to Terminal</span>
                      )}
                    </button>

                  </form>

                  {/* Success Banner */}
                  {loginSuccess && (
                    <div className="mt-3 p-2.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-mono flex items-center justify-between animate-fade-in">
                      <div className="flex items-center gap-1.5">
                        <IconCheck />
                        <span><strong>Authenticated!</strong> Session active.</span>
                      </div>
                      <a
                        href="index.html#cockpit"
                        className="px-2 py-0.5 rounded bg-emerald-600 text-white font-bold text-[10px] hover:bg-emerald-700"
                      >
                        Enter Cockpit →
                      </a>
                    </div>
                  )}

                </div>

                <div className="pt-3 border-t border-slate-100 text-[10px] font-mono text-slate-400 text-center">
                  © 2026 Algologic Technologies Pvt. Ltd. • All Rights Reserved
                </div>

              </div>

            </div>
          </main>

          {/* Forgot Password Modal */}
          {forgotModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl border border-slate-200 shadow-2xl p-5 max-w-sm w-full">
                <h4 className="text-base font-bold text-slate-900 mb-1">Reset Password</h4>
                <p className="text-xs text-slate-500 mb-3">
                  Enter your work email and we will dispatch a reset link.
                </p>

                {forgotSent ? (
                  <div className="p-2.5 bg-emerald-50 text-emerald-800 rounded-xl border border-emerald-200 text-xs font-mono mb-3">
                    ✓ Password reset link sent! Check your inbox.
                  </div>
                ) : (
                  <form onSubmit={handleForgotSubmit} className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-mono font-bold text-slate-700 mb-1">Work Email</label>
                      <input
                        type="email"
                        required
                        value={forgotEmail}
                        onChange={(e) => setForgotEmail(e.target.value)}
                        placeholder="trader@algologic.com"
                        className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-mono focus:ring-2 focus:ring-slate-900 focus:outline-none"
                      />
                    </div>
                    <div className="flex items-center justify-end gap-2 pt-1">
                      <button
                        type="button"
                        onClick={() => setForgotModal(false)}
                        className="px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="px-3 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-slate-800 font-mono"
                      >
                        Send Reset Link
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* Ultra-compact Footer */}
          <footer className="py-1 text-center text-[10px] text-slate-400 font-mono shrink-0">
            SEBI Regulatory Compliant Educational Platform • Zero Scroll Fixed Viewport
          </footer>

        </div>
      );
    }

    ReactDOM.render(<LoginPage />, document.getElementById("root"));
  </script>
</body>
</html>
